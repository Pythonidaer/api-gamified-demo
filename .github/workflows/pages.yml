name: Deploy API Courier to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and mission logic
        run: |
          node --check dist/app.js
          node --check dist/game-core.js
          node --check dist/icons.js
          node --check dist/curriculum.js
          node --check dist/progress.js
          node --check dist/runner.js
          node --check dist/exercise-worker.js
          node check-game.cjs
          node check-chapters.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
